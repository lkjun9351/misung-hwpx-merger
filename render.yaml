services:
  - type: web
    name: misung-hwpx-merger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: MERGE_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.7
